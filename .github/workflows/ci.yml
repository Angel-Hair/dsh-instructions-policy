name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Skip the prepare build so a stale committed lib/ is reported by the
      # explicit check below instead of surfacing as an install failure.
      - run: npm ci --ignore-scripts
      - run: npm run build
      # Tests import lib/, which is committed on purpose. A source-only change
      # must fail here instead of shipping a plugin that still runs old code.
      - run: git diff --exit-code -- lib
      - run: npm test
